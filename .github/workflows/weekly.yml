name: Mise à jour hebdomadaire

on:
  schedule:
    - cron: "0 5 * * 1"     # lundi 5h UTC (6h ou 7h à Paris selon la saison) : traitement complet
    # Relance de sécurité toutes les 2 heures : membres en attente d'un calcul que le site n'a pas pu
    # lancer, nouveaux essais automatiques arrivés à échéance (quota Spotify), e-mails en attente.
    # Pas le lundi de 5 h à 9 h UTC : GitHub ne garde qu'un lancement en attente par groupe, une
    # relance remplacerait le traitement du lundi s'il attend la fin d'un calcul.
    - cron: "30 */2 * * 0,2-6"
    - cron: "30 0,2,4,10,12,14,16,18,20,22 * * 1"
  workflow_dispatch:       # bouton « Run workflow », ou lancement par le site (calcul d'un membre)
    inputs:
      member:
        description: "Calcul d'un seul membre (u_xxxxxxxx), plus ceux qui attendent ; vide : traitement complet"
        required: false
        default: ""

permissions:
  contents: write

# Un traitement à la fois ; un calcul demandé pendant un autre attend son tour
concurrency:
  group: weekly-update
  cancel-in-progress: false

env:
  # Données des membres : base D1 et stockage R2 (Cloudflare)
  CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
  CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}

jobs:
  # Tâche commune : sources, salles, dédoublonnage, historique commun, publication commune
  common:
    # Traitement du lundi ou lancement manuel sans membre ; pas pour un calcul de membre ni pour la
    # relance de sécurité
    if: ${{ !inputs.member && (github.event_name != 'schedule' || github.event.schedule == '0 5 * * 1') }}
    runs-on: ubuntu-24.04   # version fixée (ubuntu-latest passe à Ubuntu 26 le 19 octobre 2026)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tâche commune
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          BANDSINTOWN_APP_ID: ${{ secrets.BANDSINTOWN_APP_ID }}
        run: python -m src.main common

      - name: Enregistrer les données communes
        run: |
          git config user.name "concerts-bot"
          git config user.email "concerts-bot@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Mise à jour du $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - name: Publier la collecte (après l'envoi des données communes)
        run: python -m src.main promote

  # Tâche membres : chaque membre (ou le membre demandé), à partir de la dernière collecte
  members:
    needs: common
    if: ${{ always() && (needs.common.result == 'success' || needs.common.result == 'skipped') }}
    runs-on: ubuntu-24.04   # version fixée (ubuntu-latest passe à Ubuntu 26 le 19 octobre 2026)
    timeout-minutes: 120    # plusieurs grands membres Spotify (c. 10 min chacun)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # inclut le commit de la tâche commune (caches à jour)

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tâche membres
        id: members_task
        env:
          MEMBER: ${{ inputs.member }}
          SAFETY_NET: ${{ github.event_name == 'schedule' && github.event.schedule != '0 5 * * 1' }}
          # Membres Spotify : rafraîchissement du jeton (chiffré en D1)
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          TOKEN_ENC_KEY: ${{ secrets.TOKEN_ENC_KEY }}
          # Collecte de plus de 7 jours : la tâche membres refait d'abord la tâche commune
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          BANDSINTOWN_APP_ID: ${{ secrets.BANDSINTOWN_APP_ID }}
          # Notifications par e-mail envoyées à la fin du calcul (version 1.9.0)
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM }}
        run: |
          if [ -n "$MEMBER" ]; then
            python -m src.main members --member "$MEMBER" --pending
          elif [ "$SAFETY_NET" = "true" ]; then
            python -m src.main members --pending
          else
            python -m src.main members
          fi

      - name: Enregistrer les données
        run: |
          git config user.name "concerts-bot"
          git config user.email "concerts-bot@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Calcul des membres du $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      # Seulement si la tâche membres a refait la collecte (collecte de plus de 7 jours) : un fichier
      # préparé par une tâche commune dont l'envoi sur GitHub a échoué n'est jamais publié
      - name: Publier la collecte (si la tâche membres l'a refaite)
        if: ${{ steps.members_task.outputs.redid_common == 'true' }}
        run: python -m src.main promote

  # Newsletter du lundi : tâche à part, envoyée même si la tâche membres a échoué ou dépassé son
  # délai (résultats de la semaine précédente pour les membres non recalculés), pas si la collecte
  # du lundi a échoué. Un envoi par semaine au plus (6 jours).
  newsletter:
    needs: [common, members]
    if: ${{ always() && github.event.schedule == '0 5 * * 1' && needs.common.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Newsletter du lundi
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM }}
        run: python -m src.main newsletter
