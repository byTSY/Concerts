name: Newsletter (essai)

# Essai de la newsletter du lundi pour un seul membre : objet « [Essai] », sans collecte ni
# calcul, envoi de la semaine non compté. Fichier à part, avec son propre groupe : un essai ne
# remplace jamais le traitement du lundi en attente (GitHub ne garde qu'un lancement en attente
# par groupe).
on:
  workflow_dispatch:
    inputs:
      member:
        description: "Membre destinataire de l'essai (u_xxxxxxxx)"
        required: true

permissions:
  contents: read

concurrency:
  group: newsletter-test
  cancel-in-progress: false

env:
  CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
  CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}

jobs:
  newsletter-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Newsletter d'essai
        env:
          TEST_MEMBER: ${{ inputs.member }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM }}
        run: python -m src.main newsletter --test-member "$TEST_MEMBER"
